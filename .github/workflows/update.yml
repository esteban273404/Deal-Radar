# Runs Deal Radar in GitHub's cloud twice a day and publishes the page to GitHub Pages,
# so the shared page stays current even when the Mac is asleep or off.
name: Update Deal Radar

on:
  # GitHub can start scheduled runs late or skip one when it's busy, so each update has a backup
  # time; odd minutes avoid the top-of-the-hour rush. Times are UTC (Central daylight time shown).
  schedule:
    - cron: "12 13 * * *"   # 8:12 AM Central (7:12 AM in winter)
    - cron: "47 13 * * *"   # 8:47 AM backup
    - cron: "12 23 * * *"   # 6:12 PM Central (5:12 PM in winter)
    - cron: "47 23 * * *"   # 6:47 PM backup
  workflow_dispatch:       # "Run workflow" button on the Actions tab

permissions:
  contents: write          # save price history back to the repo
  pages: write
  id-token: write

concurrency:
  group: deal-radar
  cancel-in-progress: false

env:
  DEAL_RADAR_DATA: cloud   # the cloud keeps its price history in cloud/; the Mac keeps its own in data/

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # product images are downloaded once and reused between runs
      - uses: actions/cache@v4
        with:
          path: cloud/img-cache
          key: img-${{ github.run_id }}
          restore-keys: img-

      - name: Install image resizer
        run: pip install --quiet pillow

      - name: Find deals
        run: python3 fetch_deals.py

      - name: Build the page
        run: |
          python3 make_share.py
          mkdir -p site
          { printf '<!doctype html>\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<style>body{margin:0}</style>\n'; cat cloud/deals-share.html; } > site/index.html

      - name: Save price history
        run: |
          git config user.name "deal-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud/price-history.json cloud/thread-prices.json cloud/query-stats.json cloud/logos
          git commit -m "Update deal data" || echo "No changes to save"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
